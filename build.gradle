plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.0'
group = 'com.taczbosses'

base { archivesName = 'taczbosses' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                taczbosses { source sourceSets.main }
            }
        }
        client { }
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    // เปลี่ยนเลขเวอร์ชันตรงนี้ได้ถ้า Gradle หา GeckoLib ตัวนี้ไม่เจอ
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.8.4')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
